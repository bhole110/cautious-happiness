<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{font-family:'Inter',-apple-system,sans-serif;background:#0a0603;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px 16px;position:relative}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 70% 45% at 50% 12%,rgba(255,90,20,0.30) 0%,transparent 62%),radial-gradient(circle 55% at 12% 88%,rgba(200,40,10,0.22) 0%,transparent 58%),radial-gradient(circle 50% at 90% 80%,rgba(255,140,30,0.18) 0%,transparent 55%);pointer-events:none;z-index:0}
.card{position:relative;width:100%;max-width:410px;background:linear-gradient(168deg,#1c0d05 0%,#120703 55%,#1a0a04 100%);border:1px solid rgba(255,110,30,0.28);border-radius:24px;padding:30px 24px 28px;z-index:2;box-shadow:0 22px 60px rgba(255,80,10,0.20),0 4px 20px rgba(0,0,0,0.55),inset 0 1px 0 rgba(255,170,90,0.10);animation:rise 0.55s cubic-bezier(0.16,1,0.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.avatar-wrap{position:relative;width:148px;height:148px;margin:0 auto 20px}
.avatar-ring{position:absolute;inset:-4px;border-radius:22px;background:linear-gradient(135deg,#ff8a1e,#ff4d10 55%,#c92a08);opacity:0.9;animation:glow 2.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 22px rgba(255,90,20,0.45)}50%{box-shadow:0 0 38px rgba(255,120,30,0.75)}}
.avatar{position:relative;width:100%;height:100%;border-radius:18px;background-image:url('https://i.ibb.co/Kcwzw1qG/tg-img-047om-K.jpg');background-size:cover;background-position:center;border:2px solid #0a0301}
h1{font-family:'Bebas Neue',sans-serif;font-size:40px;font-weight:400;letter-spacing:4px;line-height:1;text-align:center;margin-bottom:4px;background:linear-gradient(180deg,#ffd9b0 0%,#ff6a1c 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 10px rgba(255,90,20,0.35))}
.divider{width:54px;height:2px;margin:12px auto 16px;background:linear-gradient(90deg,transparent,#ff6a1c,transparent);border-radius:2px}
.tagline{font-size:15px;font-weight:600;color:#ffb27a;text-align:center;letter-spacing:0.3px;margin-bottom:22px}
.cta{display:block;width:100%;position:relative;background:linear-gradient(135deg,#ff7a18 0%,#ff5a10 50%,#e23c06 100%);color:#fff;padding:21px 16px;border-radius:15px;text-decoration:none;font-weight:900;font-size:19px;letter-spacing:1.4px;text-transform:uppercase;text-align:center;border:1px solid rgba(255,190,140,0.35);cursor:pointer;overflow:hidden;box-shadow:0 12px 30px rgba(255,80,10,0.42),inset 0 1px 0 rgba(255,255,255,0.3);transition:transform 0.14s ease;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 12px 30px rgba(255,80,10,0.42),inset 0 1px 0 rgba(255,255,255,0.3)}50%{box-shadow:0 14px 40px rgba(255,110,30,0.62),inset 0 1px 0 rgba(255,255,255,0.35)}}
.cta::before{content:'';position:absolute;top:0;left:-80%;width:55%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.4),transparent);animation:sweep 3s ease-in-out infinite}
@keyframes sweep{0%{left:-80%}55%,100%{left:130%}}
.cta:active{transform:scale(0.97)}
.cta-icon{margin-right:8px;font-size:20px;vertical-align:middle}
.timer-box{margin-top:20px;padding:15px 12px;border:1px solid rgba(255,110,30,0.28);border-radius:14px;background:rgba(255,90,20,0.05)}
.timer-label{font-size:11px;font-weight:700;letter-spacing:2px;color:#ff8a3c;margin-bottom:11px;text-align:center;text-transform:uppercase}
.timer-units{display:flex;justify-content:center;gap:10px}
.unit{min-width:84px;border:1px solid rgba(255,110,30,0.32);border-radius:10px;padding:9px 14px;background:rgba(0,0,0,0.35);text-align:center}
.unit-num{font-family:'Bebas Neue',sans-serif;font-size:28px;color:#fff;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:1px}
.unit-label{font-size:9px;color:#b89684;text-transform:uppercase;letter-spacing:1.4px;margin-top:3px;font-weight:600}
</style>

<body>
<div class="card">

    <div class="timer-units">
      <div class="unit"><div class="unit-num" id="t-s">30</div><div class="unit-label">Seconds</div></div>
    </div>
  </div>
</div>
